<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Climate answers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#e01e1a;--red-h:#a11b14;--ink:#343a40;--mid:#6c757d;--soft:#9aa0a6;--line:#e3e5e8;--bg:#f9f9fa;--panel:#fff;--sel:#fdecea;--warn:#fff6e0;--warnline:#e6c46a;--ok:#2f7a45}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e9ecef;--mid:#adb5bd;--soft:#868e96;--line:#3a3f45;--bg:#1d2024;--panel:#272b30;--sel:#4a2422;--warn:#3d3420;--warnline:#8a7130}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Graphik,Inter,Helvetica,Arial,sans-serif}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.ribbon{background:#343a40;color:#fff;padding:16px 28px;font-size:20px;font-weight:600}
.ribbon .sep{color:#adb5bd;margin:0 10px;font-weight:400}
.wrap{max-width:1180px;margin:0 auto;padding:18px 28px 12px}
.steps{display:flex;gap:10px;align-items:center;color:var(--soft);font-size:14px;margin-bottom:6px}
.steps b{color:var(--ink)}.steps i{width:24px;height:1px;background:var(--line);display:inline-block}
h1{font-size:28px;font-weight:600;margin:4px 0 16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin-bottom:14px}
.lbl{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mid);margin-bottom:10px}
.row{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;padding:8px 0}
.row+.row{border-top:1px solid var(--line)}
.k{color:var(--mid)}
textarea,select,input[type=text]{width:100%;border:1px solid #c8ccd0;border-radius:8px;padding:9px 12px;background:var(--panel)}
textarea{resize:vertical;min-height:44px}
.ex{font-size:14px;color:var(--mid);margin-top:6px}.ex button{background:none;border:0;color:var(--red);padding:0 6px;cursor:pointer;text-decoration:underline}
.out{text-align:center;padding:26px 20px}
.big{font-size:54px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.ctx{font-size:20px;color:var(--soft);margin-top:6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.seg{display:inline-flex;border:1px solid #c8ccd0;border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 16px;cursor:pointer}.seg button+button{border-left:1px solid #c8ccd0}
.seg button[aria-pressed=true]{background:var(--red);color:#fff}
.tag{font-size:13px;color:var(--soft);margin-left:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #c8ccd0;border-radius:999px;padding:4px 12px;margin:2px 6px 2px 0;background:var(--panel)}
.chip button{border:0;background:none;color:var(--mid);cursor:pointer;padding:0 0 0 2px;font-size:16px;line-height:1}
.add{border:0;background:none;color:var(--red);cursor:pointer;text-decoration:underline;padding:0}
table{width:100%;border-collapse:collapse}th{text-align:left;font-weight:500;color:var(--mid);font-size:13px;padding:6px 0}
td{padding:8px 0;border-top:1px solid var(--line)}.r{text-align:right}
.rate{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:12px;font-weight:600;color:#fff;background:#b3261e}
.alert{background:var(--warn);border:1px solid var(--warnline);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.alert button{margin-left:8px}
.err{border-color:var(--red)}
.foot{background:var(--panel);border-top:1px solid var(--line);padding:14px 28px;margin-top:8px}
.foot .in{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border-radius:999px;padding:10px 22px;border:1px solid #c8ccd0;background:var(--panel);cursor:pointer;font-weight:500}
.btn.p{background:var(--red);border-color:var(--red);color:#fff}.btn.p:hover{background:var(--red-h)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ok{display:inline-block;border:1px solid var(--ok);color:var(--ok);border-radius:999px;padding:2px 12px;font-size:14px}
.mail{white-space:pre-wrap;line-height:1.7;min-height:330px}
a{color:var(--red)}
.muted{color:var(--mid)}
.demo{background:#fff8e1;color:#5a4a00;font-size:14px;padding:8px 28px}
@media (max-width:760px){.cols{grid-template-columns:1fr}.row{grid-template-columns:1fr;gap:4px}.big{font-size:40px}.ribbon{font-size:17px}.wrap{padding:14px 16px 12px}.foot{padding:12px 16px}}
</style></head>
<body>
<div id="app"></div>
<script>
async function api(path, body) {
  if (window.mockApi) return window.mockApi(path, body);
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {});
  const j = await r.json(); if (!r.ok) throw new Error(j.detail || 'Something went wrong'); return j;
}
const EXAMPLES = ['How many CRE loans have a flood rating of E or worse by 2050?', "What's our total expected climate loss by 2050?",
  'How much of our 2024 and 2025 lending went into high subsidence areas?', 'How much do expected losses rise from 2030 to 2050 under the severe scenario?'];
const ASKERS = [['Credit committee','committee'],['Risk committee','committee'],['CRO','other'],['PRA / stress test','pra'],['Mortgage pricing','other'],['Treasury','other'],['Investor relations','other']];
const SCEN = [['low','Low'],['central','Central'],['severe','Severe']];
const EXCL = [['in_default','Loans in default'],['redeemed','Redeemed since the export'],['maturing_before','Maturing before 2030']];
const S = {view:'draft', question:'', asker:'Credit committee', interp:null, choices:null, sources:{}, rec:null, note:'', comment:'', error:'', sentBack:'', changedBySarah:false, mail:''};
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = x => x == null ? '' : x >= 1e9 ? `£${(x/1e9).toFixed(1)}bn` : x >= 1e6 ? `£${(x/1e6).toFixed(1)}m` : x >= 1e3 ? `£${Math.round(x/1e3)}k` : `£${Math.round(x)}`;
const fmtDate = d => new Date(d).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
const audience = () => (ASKERS.find(a => a[0] === S.asker) || [0,'other'])[1];
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

let qTimer, lastQ = '';
function onQuestion(v) { S.question = v; clearTimeout(qTimer); qTimer = setTimeout(() => { if (S.question.trim() !== lastQ) interpretNow(); }, 500); }
async function interpretNow() {
  lastQ = S.question.trim(); S.error = ''; S.rec = null; S.interp = null;
  if (S.question.trim().split(/\s+/).length < 3) { render(); return; }
  try {
    S.interp = await api('/api/interpret', {question:S.question, audience:audience(), asker:S.asker});
    S.choices = JSON.parse(JSON.stringify(S.interp.choices)); S.sources = {...S.interp.sources};
    await preview();
  } catch (e) { S.error = e.message; render(); }
}
async function preview() {
  try {
    S.rec = await api('/api/compute', {question:S.question, audience:audience(), asker:S.asker, choices:S.choices, sources:S.sources,
      question_years:S.interp.question_years, reasons:{}, preview:true});
    S.error = '';
  } catch (e) { S.error = e.message; }
  render();
}
function setChoice(field, value) { S.choices[field] = value; S.sources[field] = 'analyst'; if (S.view === 'review') S.changedBySarah = true; preview(); }

// ---------- pieces ----------
function bigNumber(res, c) {
  const d = res.grid[0].detail || {};
  if (c.measure === 'count') return [`${d.n} ${c.unit === 'properties' ? 'properties' : 'loans'} · ${money(d.balance)}`, `of ${d.of_n} · of ${money(d.of_balance)} balance`];
  if (c.measure === 'share') return [`${money(d.balance)} · ${(d.share*100).toFixed(1)}%`, `of ${money(d.of_balance)} new lending · older book ${(d.older_share*100).toFixed(1)}%`];
  if (c.measure === 'rise') return [`${res.grid[0].value.toFixed(2)}×`, res.grid[0].text.split(': ')[1].split(' = ')[0]];
  return [money(d.loss), 'annual expected damage to properties'];
}
function countChips(c) {
  const out = [];
  out.push(c.loan_type === 'Commercial real estate' ? 'CRE loans' : c.loan_type === 'Residential mortgage' ? 'Mortgages' : 'All loans');
  const hz = (c.hazards || []).length ? c.hazards.map(h => h[0].toUpperCase() + h.slice(1)).join(', ') : 'All hazards';
  out.push(c.rating_min ? `${hz} rating ${c.rating_min}${c.rating_max && c.rating_max !== 'G' ? '–' + c.rating_max : ' or worse'}` : hz);
  if (c.originated) out.push(`Lent in ${c.originated.join(' and ')}`);
  return out.map(t => `<span class="chip">${esc(t)}</span>`).join('');
}
function controls(editable, asSelect) {
  const c = S.choices, d = S.rec.defaults || {};
  const scen = c.scenarios[0], isDef = same(c.scenarios, d.scenarios);
  const yrs = S.rec ? (window.mockApi ? ['2030','2050'] : ['2030','2050']) : [];
  const scenCtl = asSelect
    ? `<select aria-label="Scenario" style="width:auto" onchange="setChoice('scenarios',[this.value])">${SCEN.map(([k,l]) => `<option value="${k}" ${k===scen?'selected':''}>${l}</option>`).join('')}</select>`
    : `<span class="seg" role="group" aria-label="Scenario">${SCEN.map(([k,l]) => `<button aria-pressed="${k===scen}" onclick="setChoice('scenarios',['${k}'])">${l}</button>`).join('')}</span>`;
  let yearCtl;
  if (c.measure === 'rise') yearCtl = `<span>${c.years.join(' → ')}</span>`;
  else yearCtl = asSelect
    ? `<select aria-label="Horizon" style="width:auto" onchange="setChoice('years',[this.value])">${yrs.map(y => `<option ${c.years[0]===y?'selected':''}>${y}</option>`).join('')}</select>`
    : `<span class="seg" role="group" aria-label="Horizon">${yrs.map(y => `<button aria-pressed="${c.years[0]===y}" onclick="setChoice('years',['${y}'])">${y}</button>`).join('')}</span>`;
  const ex = c.exclusions || {};
  const on = EXCL.filter(([k]) => ex[k]), off = EXCL.filter(([k]) => !ex[k]);
  const exCtl = on.map(([k,l]) => `<span class="chip">${l}<button aria-label="Remove ${l}" onclick="toggleEx('${k}',false)">×</button></span>`).join('')
    + (off.length ? off.map(([k,l]) => `<button class="add" onclick="toggleEx('${k}',true)">+ ${l}</button>`).join(' ') : '');
  const yDef = same(c.years, d.years) && S.sources.years !== 'question';
  return `<div class="panel">
    <div class="row"><div class="k">${c.measure === 'count' ? 'Count' : 'Covers'}</div><div>${countChips(c)}</div></div>
    <div class="row"><div class="k">Scenario</div><div>${scenCtl}${isDef ? '<span class="tag">Default</span>' : ''}</div></div>
    <div class="row"><div class="k">Horizon</div><div>${yearCtl}${yDef && c.measure !== 'rise' ? '<span class="tag">Default</span>' : ''}</div></div>
    <div class="row"><div class="k">Excludes</div><div>${exCtl || '<span class="muted">Nothing</span>'}</div></div>
  </div>`;
}
function toggleEx(k, v) { const ex = {...S.choices.exclusions}; ex[k] = v ? (k === 'maturing_before' ? 2030 : true) : (k === 'maturing_before' ? null : false); setChoice('exclusions', ex); }
function evidence(res) {
  if (res.rows) {
    return `<div class="panel"><div class="lbl">The ${res.rows_total} loan${res.rows_total === 1 ? '' : 's'}</div>
      ${res.rows.length ? `<table><tr><th>Loan</th><th>Property</th><th>Region</th><th class="r">Balance</th><th class="r">Rating</th></tr>
      ${res.rows.map(r => `<tr><td>${esc(r.loan_id)}</td><td>${esc(r.property_type)}</td><td>${esc(r.region.replace(' and the Humber',''))}</td><td class="r">${money(r.balance)}</td><td class="r"><span class="rate" aria-label="Rating ${r.rating}">${esc(r.rating)}</span></td></tr>`).join('')}</table>
      ${res.rows_total > res.rows.length ? `<p class="muted">Showing the ${res.rows.length} largest. All ${res.rows_total} are in the file.</p>` : ''}` : '<p class="muted">No loans match. Try another scenario or horizon, or remove an exclusion.</p>'}</div>`;
  }
  const dr = res.drivers || {};
  const tbl = (t, o) => `<table><tr><th>${t}</th><th class="r">Damage</th></tr>${Object.entries(o).sort((a,b) => b[1]-a[1]).slice(0,5).map(([k,v]) => `<tr><td>${esc(k[0].toUpperCase()+k.slice(1))}</td><td class="r">${money(v)}</td></tr>`).join('')}</table>`;
  return `<div class="panel"><div class="lbl">Where it comes from</div>${dr.by_hazard ? tbl('Hazard', dr.by_hazard) : ''}${dr.by_region ? '<div style="height:12px"></div>' + tbl('Region', dr.by_region) : ''}</div>`;
}
function writeup(res) {
  const skip = /^(Scenario|Population|Excludes|Counting|Hazards)/;
  const extra = res.method_note.filter(l => !skip.test(l)).map(l => l.startsWith('Data:') ? (l.match(/(\d+ loans? didn't match.*)$/) || [,''])[1] : l).filter(Boolean).map(l => l[0].toUpperCase() + l.slice(1));
  if ((S.choices.rating_min)) extra.unshift('Where a loan has more than one property, its worst rating is used.');
  return `<div class="lbl">Also in the write-up</div>${extra.map(l => `<p style="margin:0 0 6px">${esc(l.replace(/ \(ssp\d+\)/,''))}</p>`).join('')}`;
}
function failed(res) { return res.checks.filter(c => !c.ok); }
function header(user, job, step) {
  const steps = ['Draft','Review','Send'].map(s => s === step ? `<b>${s}</b>` : s).join('<i></i>');
  return `${window.demoNote ? `<div class="demo">${esc(window.demoNote)}</div>` : ''}<div class="ribbon">User: ${user}<span class="sep">·</span>Job to be done: ${job}</div>
    <div class="wrap"><div class="steps" aria-label="Steps">${steps}</div>`;
}
const meta = () => window._meta ? `Spectra export, ${fmtDate(window._meta.export_as_at)} · Loan book, ${fmtDate(window._meta.book_as_at)}` : '';

// ---------- screens ----------
function draftView() {
  const res = S.rec && S.rec.result, flags = (S.interp && S.interp.flags || []).filter(f => ['out_of_scope','not_in_data','split'].includes(f.kind));
  let h = header('Analyst', 'turn the question into the right calculation', 'Draft') + `<h1>Draft</h1>`;
  if (S.sentBack) h += `<div class="alert"><b>Sent back by Sarah:</b> ${esc(S.sentBack)}</div>`;
  h += `<div class="panel">
    <div class="row"><div class="k"><label for="q">Question</label></div><div><textarea id="q" rows="2" oninput="onQuestion(this.value)" placeholder="Paste the question as it was asked">${esc(S.question)}</textarea>
      <div class="ex">Examples:${EXAMPLES.map((e,i) => `<button onclick="useExample(${i})">${i+1}</button>`).join('')}</div></div></div>
    <div class="row"><div class="k"><label for="asker">Asked by</label></div><div><select id="asker" style="max-width:420px" onchange="S.asker=this.value;interpretNow()">${ASKERS.map(([a]) => `<option ${a===S.asker?'selected':''}>${a}</option>`).join('')}</select></div></div>
    <div class="row"><div class="k">Data</div><div>${meta()}</div></div></div>`;
  flags.forEach(f => h += `<div class="alert">${esc(f.text)}</div>`);
  if (S.error) h += `<div class="alert">${esc(S.error)}</div>`;
  if (res) {
    const [b, ctx] = bigNumber(res, S.choices);
    h += `<div class="panel out"><div class="big" aria-live="polite">${esc(b)}</div><div class="ctx">${esc(ctx)}</div></div>`;
    failed(res).forEach(c => h += `<div class="alert">${esc(c.detail)}.</div>`);
    h += `<div class="cols">${controls(true, false)}${evidence(res)}</div>
      <div class="cols"><div class="panel">${writeup(res)}</div>
      <div class="panel"><div class="lbl"><label for="note">Note to Sarah${failed(res).length ? ' (needed: explain the warning)' : ' (optional)'}</label></div><textarea id="note" rows="3" oninput="S.note=this.value">${esc(S.note)}</textarea></div></div>`;
  } else if (!S.error) h += `<div class="panel muted">Paste a question to see the draft.</div>`;
  h += `</div><div class="foot"><div class="in"><button class="btn" onclick="reset()">Cancel</button><button class="btn p" ${res ? '' : 'disabled'} onclick="sendToSarah()">Send draft to Sarah →</button></div></div>`;
  return h;
}
function reviewView() {
  const res = S.rec.result, [b, ctx] = bigNumber(res, S.choices);
  let h = header('Sarah', 'approve the draft or send it back', 'Review') + `<h1>Review the draft</h1>
    <div class="panel"><div class="row"><div class="k">Question</div><div>${esc(S.question)}</div></div>
    <div class="row"><div class="k">Asked by</div><div>${esc(S.asker)}</div></div>
    <div class="row"><div class="k">Data</div><div>${meta()}</div></div>
    ${S.note ? `<div class="row"><div class="k">Analyst's note</div><div>“${esc(S.note)}”</div></div>` : ''}</div>`;
  if (S.error) h += `<div class="alert">${esc(S.error)}</div>`;
  h += `<div class="panel out"><div class="big" aria-live="polite">${esc(b)}</div><div class="ctx">${esc(ctx)}</div></div>
    <div class="cols">${controls(true, true)}${evidence(res)}</div>
    <div class="cols"><div class="panel">${writeup(res)}</div>
    <div class="panel"><div class="lbl"><label for="cm">Comment to the analyst</label></div><textarea id="cm" rows="3" placeholder="Needed to send back" oninput="S.comment=this.value">${esc(S.comment)}</textarea></div></div>
    </div><div class="foot"><div class="in"><button class="btn" onclick="sendBack()">Send back</button><button class="btn p" onclick="approve()">Approve</button></div></div>`;
  return h;
}
function mailText() {
  const res = S.rec.result; const sev = (res.versions || []).find(v => v.change === 'scenario → severe');
  const head = res.headline.replace(/ \((central|severe|low-emissions)\)$/, ' under the $1 scenario');
  return `Hi all,\n\n${head[0].toUpperCase() + head.slice(1)}.${sev ? `\n\nUnder the severe scenario: ${sev.text.replace(/ \(severe\)$/, '')}.` : ''}\n\nThe loans and how they were counted are in the attached file.\n\nApproved by Sarah Okafor, Head of Climate Risk.`;
}
function sendView() {
  if (!S.mail) S.mail = mailText();
  const subj = 'Re: ' + S.question.replace(/\?$/, '');
  let h = header('Analyst', 'send the approved answer to whoever asked', 'Send') + `<h1>Send the answer</h1>
    <p><span class="ok">Approved by Sarah · ${new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</span></p>
    <div class="panel"><div class="row"><div class="k">To</div><div><input type="text" value="${esc(S.asker)}"></div></div>
    <div class="row"><div class="k">Subject</div><div><input type="text" value="${esc(subj)}"></div></div>
    <textarea class="mail" style="margin-top:10px" aria-label="Reply" oninput="S.mail=this.value">${esc(S.mail)}</textarea>
    <p style="margin:10px 0 0">Attached: ${window.mockApi ? '<b>answer.xlsx</b>' : `<a href="/api/answers/${S.rec.id}/export.xlsx"><b>answer.xlsx</b></a>`}</p></div>
    </div><div class="foot"><div class="in"><span></span><button class="btn p" onclick="sendIt()">Send</button></div></div>`;
  return h;
}
function sentView() {
  return header('Analyst', 'send the approved answer to whoever asked', 'Send') + `<h1>Sent</h1>
    <div class="panel">Sent to ${esc(S.asker)} and logged: who asked, who built it, Sarah's approval, the data dates.</div>
    </div><div class="foot"><div class="in"><span></span><button class="btn p" onclick="reset()">New question</button></div></div>`;
}

// ---------- actions ----------
function useExample(i) { S.question = EXAMPLES[i]; interpretNow(); }
function reset() { Object.assign(S, {view:'draft', question:'', interp:null, choices:null, sources:{}, rec:null, note:'', comment:'', error:'', sentBack:'', changedBySarah:false, mail:''}); render(); }
async function finalise(reasonText) {
  const reasons = {}; (S.rec.departures || []).forEach(d => reasons[d.field] = reasonText);
  return api('/api/compute', {question:S.question, audience:audience(), asker:S.asker, choices:S.choices, sources:S.sources, question_years:S.interp.question_years, reasons});
}
async function sendToSarah() {
  try {
    const f = failed(S.rec.result);
    if (f.length && !S.note.trim()) { S.error = 'Add a note to Sarah explaining the warning, or fix it first.'; return render(); }
    S.rec = await finalise(S.note.trim() || 'Changed by the analyst');
    S.rec = await api(`/api/answers/${S.rec.id}/submit`, {comment:S.note});
    S.view = 'review'; S.error = ''; S.sentBack = ''; S.comment = ''; render(); scrollTo(0,0);
  } catch (e) { S.error = e.message; render(); }
}
async function sendBack() {
  if (!S.comment.trim()) { S.error = 'Add a comment so the analyst knows what to change.'; return render(); }
  try { await api(`/api/answers/${S.rec.id}/review`, {decision:'send_back', comment:S.comment}); S.sentBack = S.comment; S.view = 'draft'; S.error = ''; render(); scrollTo(0,0); }
  catch (e) { S.error = e.message; render(); }
}
async function approve() {
  try {
    if (S.changedBySarah) { S.rec = await finalise('Changed by Sarah'); S.rec = await api(`/api/answers/${S.rec.id}/submit`, {comment:'Changed by Sarah at review'}); }
    S.rec = await api(`/api/answers/${S.rec.id}/review`, {decision:'approve', comment:S.comment});
    S.view = 'send'; S.error = ''; render(); scrollTo(0,0);
  } catch (e) { S.error = e.message; render(); }
}
async function sendIt() { try { await api(`/api/answers/${S.rec.id}/send`, {}); S.view = 'sent'; render(); } catch (e) { alert(e.message); } }
function render() {
  const a = document.activeElement, id = a && a.id, st = a && a.selectionStart, en = a && a.selectionEnd;
  $('#app').innerHTML = {draft:draftView, review:reviewView, send:sendView, sent:sentView}[S.view]();
  if (id && $('#' + id)) { const e = $('#' + id); e.focus(); if (st != null && e.setSelectionRange) e.setSelectionRange(st, en); }
}
(async () => { window._meta = await api('/api/meta'); render(); })();
</script>
</body></html>
