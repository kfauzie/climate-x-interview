<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Answer With Its Method</title>
<style>
/* Layout: product-style shell (top bar, stepper, working column + settings side panel, sticky action bar).
   Brand tokens from climate-x.com's CSS; look and feel from Spectra/Carta screenshots: white panels, hairline dividers,
   small grey section labels, light-weight large numbers, rating letters in circles, pill buttons, red only for active/primary. */
:root {
  --brand:#e01e1a; --brand-strong:#a11b14; --brand-soft:#fdecec;
  --ink:#343a40; --muted:#6c757d; --faint:#9aa1a8; --bg:#f9f9fa; --surface:#ffffff; --line:#e9ecef; --line-strong:#dee2e6; --hover:#f4f5f6;
  --ok:#198754; --ok-soft:#e8f5ee; --fail:#b42318; --fail-soft:#fdeceb; --warn:#9a6700; --warn-soft:#fff6db; --info:#495057; --info-soft:#f1f3f5;
  --r-a:#adb5bd; --r-b:#868e96; --r-c:#c9a227; --r-d:#d9480f; --r-e:#c92a2a; --r-f:#8b1a1a; --r-g:#2b2b2b;
  --on-brand:#ffffff; --shadow:0 1px 2px rgba(33,37,41,.05);
  --font:Graphik, Helvetica, Arial, sans-serif; --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --brand:#f0524e; --brand-strong:#ff7b77; --brand-soft:#3a1716; --ink:#e8eaed; --muted:#a0a7b0; --faint:#7d858e; --bg:#121416; --surface:#1b1e21; --line:#2a2e33; --line-strong:#353b41; --hover:#23272b;
  --ok:#4cc38a; --ok-soft:#14291f; --fail:#ff8a7a; --fail-soft:#351b18; --warn:#e8b54d; --warn-soft:#2e2615; --info:#c9d1da; --info-soft:#22262a; --r-g:#d0d4d8; color-scheme:dark } }
:root[data-theme="dark"] {
  --brand:#f0524e; --brand-strong:#ff7b77; --brand-soft:#3a1716; --ink:#e8eaed; --muted:#a0a7b0; --faint:#7d858e; --bg:#121416; --surface:#1b1e21; --line:#2a2e33; --line-strong:#353b41; --hover:#23272b;
  --ok:#4cc38a; --ok-soft:#14291f; --fail:#ff8a7a; --fail-soft:#351b18; --warn:#e8b54d; --warn-soft:#2e2615; --info:#c9d1da; --info-soft:#22262a; --r-g:#d0d4d8; color-scheme:dark }
* { box-sizing:border-box }
html, body { margin:0 }
body { background:var(--bg); color:var(--ink); font:15px/1.55 var(--font); -webkit-font-smoothing:antialiased }
.top { position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:var(--surface); border-bottom:1px solid var(--line);
  padding:10px max(20px, env(safe-area-inset-right, 0px)) 10px max(20px, env(safe-area-inset-left, 0px)); display:flex; gap:10px 20px; align-items:center; flex-wrap:wrap }
.brand { font-weight:600; font-size:16px; letter-spacing:-.01em } .brand em { font-style:normal; color:var(--brand) }
.datachip { font-size:12px; color:var(--muted) } .grow { flex:1 }
.seg { display:inline-flex; border:1px solid var(--line-strong); border-radius:999px; overflow:hidden }
.seg button { border:0; background:var(--surface); color:var(--muted); padding:6px 14px; font:inherit; font-size:13px; cursor:pointer; text-transform:uppercase; letter-spacing:.04em }
.seg button[aria-pressed="true"] { background:var(--brand); color:var(--on-brand) }
.page { max-width:1080px; margin:0 auto; padding:24px max(20px, env(safe-area-inset-right, 0px)) 120px max(20px, env(safe-area-inset-left, 0px)) }
.stepper { display:flex; gap:8px; align-items:center; margin-bottom:22px; flex-wrap:wrap }
.stepper .s { display:flex; align-items:center; gap:8px; color:var(--faint); font-size:14px }
.stepper .n { width:24px; height:24px; border-radius:50%; border:1px solid var(--line-strong); display:grid; place-items:center; font-size:12px }
.stepper .s.on { color:var(--ink); font-weight:500 } .stepper .s.on .n { background:var(--brand); border-color:var(--brand); color:var(--on-brand) }
.stepper .s.done { color:var(--muted) } .stepper .s.done .n { background:var(--ink); border-color:var(--ink); color:var(--surface) } .stepper .bar { width:32px; height:1px; background:var(--line-strong) }
h1 { font-size:24px; line-height:1.25; margin:0 0 4px; font-weight:500; letter-spacing:-.01em; text-wrap:balance } .sub { color:var(--muted); margin:0 0 20px }
.layout { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:20px; align-items:start } .layout > * { min-width:0 }
.card { background:var(--surface); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); margin-bottom:16px; min-width:0 }
.card > .bd { padding:18px 20px } .sec { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:500; padding:14px 20px 0; margin:0 }
.card .sec + .bd { padding-top:10px }
.lbl { display:block; font-weight:500; font-size:14px; margin:0 0 6px } .hint { color:var(--muted); font-size:13px; margin-top:6px }
textarea, input[type=text], select { width:100%; font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line-strong); border-radius:6px; padding:10px 12px }
select { border-radius:999px; padding:8px 14px } textarea { min-height:88px; resize:vertical }
textarea:focus, input:focus, select:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft) }
.field + .field { margin-top:18px }
.examples { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:center } .examples span { color:var(--muted); font-size:13px }
.pill { border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); border-radius:999px; padding:5px 14px; font:inherit; font-size:13px; cursor:pointer }
.pill:hover { border-color:var(--brand); color:var(--brand) }
.choices { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:10px }
.opt { position:relative; border:1px solid var(--line-strong); border-radius:8px; padding:12px 14px; cursor:pointer; display:grid; gap:2px; background:var(--surface) }
.opt input { position:absolute; opacity:0; pointer-events:none } .opt b { font-weight:500 } .opt small { color:var(--muted) }
.opt:has(input:checked) { border-color:var(--brand); box-shadow:inset 0 0 0 1px var(--brand) } .opt:has(input:focus-visible) { outline:2px solid var(--brand); outline-offset:2px }
.rows .row { display:grid; grid-template-columns:170px minmax(0,1fr) auto; gap:16px; padding:14px 20px; border-top:1px solid var(--line); align-items:start }
.rows .row:first-child { border-top:0 } .row .k { color:var(--muted); font-size:14px; padding-top:7px } .row .v { min-width:0 }
.tag { font-size:12px; padding:3px 10px; border-radius:999px; white-space:nowrap; background:var(--info-soft); color:var(--info); display:inline-flex; gap:4px; align-items:center }
.tag.question { background:var(--ok-soft); color:var(--ok) } .tag.analyst { background:var(--warn-soft); color:var(--warn) }
.tag.fail { background:var(--fail-soft); color:var(--fail) } .tag.pass { background:var(--ok-soft); color:var(--ok) } .tag.brand { background:var(--brand); color:var(--on-brand) }
.chips { display:flex; flex-wrap:wrap; gap:6px; align-items:center }
.chk { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line-strong); border-radius:999px; padding:5px 14px; cursor:pointer; font-size:14px; background:var(--surface) }
.chk input { position:absolute; opacity:0; pointer-events:none } .chk:has(input:checked) { border-color:var(--brand); background:var(--brand); color:var(--on-brand) }
.chk:has(input:focus-visible) { outline:2px solid var(--brand); outline-offset:2px }
.rate { width:30px; height:30px; padding:0; justify-content:center; font-weight:600; color:#fff; border:0 }
.rate:not(:has(input:checked)) { opacity:.35 } .rate:has(input:checked) { box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--ink) }
.flag { margin-top:8px; padding:9px 12px; border-radius:6px; font-size:14px; background:var(--warn-soft); display:flex; gap:8px }
.flag::before { content:"!"; font-weight:700; color:var(--warn) } .flag.out_of_scope, .flag.not_in_data { background:var(--fail-soft) } .flag.out_of_scope::before, .flag.not_in_data::before { color:var(--fail) }
.flag.suggestion { background:var(--info-soft) } .flag.suggestion::before { content:"i"; color:var(--info) }
.dep { margin-top:8px; padding:10px 12px; border-radius:6px; background:var(--warn-soft); font-size:13px; display:grid; gap:6px }
.add { display:flex; gap:10px; align-items:center; padding:14px 20px; border-top:1px dashed var(--line-strong); flex-wrap:wrap } .add select { max-width:240px }
.x { border:0; background:none; color:var(--faint); cursor:pointer; font-size:18px; line-height:1; padding:2px 6px; border-radius:50% } .x:hover { background:var(--hover); color:var(--fail) }
.btn { font:inherit; font-size:14px; font-weight:500; border-radius:999px; padding:9px 20px; cursor:pointer; border:1px solid transparent; display:inline-flex; gap:6px; align-items:center; text-decoration:none }
.btn.primary { background:var(--brand); color:var(--on-brand) } .btn.primary:hover { background:var(--brand-strong) }
.btn.secondary { background:var(--surface); color:var(--ink); border-color:var(--line-strong) } .btn.secondary:hover { background:var(--hover) }
.btn.danger { background:var(--surface); color:var(--fail); border-color:var(--fail) } .btn.small { padding:4px 12px; font-size:13px }
.btn:focus-visible, .pill:focus-visible, .seg button:focus-visible, .li:focus-visible { outline:2px solid var(--brand); outline-offset:2px }
.actions { position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--surface); border-top:1px solid var(--line);
  padding:12px max(20px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)) }
.actions .in { max-width:1080px; margin:0 auto; display:flex; gap:8px; align-items:center } .actions .err { color:var(--fail); font-size:14px; flex:1; text-align:right }
.kpi .big { font-size:30px; font-weight:300; line-height:1.25; letter-spacing:-.01em; font-variant-numeric:tabular-nums; text-wrap:balance; margin:8px 0 }
.kpi .alt { color:var(--muted); font-variant-numeric:tabular-nums }
.vers .vr { display:grid; grid-template-columns:150px minmax(0,1fr); gap:12px; padding:10px 0; border-top:1px solid var(--line); font-variant-numeric:tabular-nums; font-size:14px } .vers .vr:first-child { border-top:0 }
.vers .vr b { font-weight:500; color:var(--muted) } .verdict { display:flex; gap:8px; align-items:flex-start; font-size:14px; padding-top:10px; border-top:1px solid var(--line); margin-top:4px }
ol.note { margin:0; padding-left:20px; display:grid; gap:6px; font-size:14px }
.checks .c { display:grid; grid-template-columns:70px minmax(0,1fr); gap:10px; padding:9px 0; border-top:1px solid var(--line); font-size:14px } .checks .c:first-child { border-top:0 } .checks .c > .tag, .verdict > .tag { align-self:start; justify-self:start }
.foot { font-size:12px; color:var(--faint) }
.side .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:14px } .side .kv dt { color:var(--muted) } .side .kv dd { margin:0; text-align:right }
.list .li { display:grid; gap:4px; padding:14px 20px; border:0; border-top:1px solid var(--line); cursor:pointer; text-align:left; background:none; font:inherit; color:inherit; width:100% }
.list .li:first-child { border-top:0 } .list .li:hover { background:var(--hover) } .li .meta { color:var(--muted); font-size:13px }
.callout { border:1px solid var(--line); border-left:3px solid var(--fail); border-radius:8px; background:var(--surface); padding:16px 20px; margin-bottom:16px; display:grid; gap:8px }
.callout.fast { border-left-color:var(--brand) } .callout h2 { margin:0; font-size:15px; font-weight:500 }
.empty { color:var(--muted); padding:18px 20px } .note-demo { background:var(--info-soft); border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:16px }
@media (max-width:860px) { .layout { grid-template-columns:1fr } }
@media (max-width:640px) { .rows .row { grid-template-columns:1fr; gap:6px } .row .k { padding-top:0 } .vers .vr { grid-template-columns:1fr; gap:2px } .stepper .bar { display:none } h1 { font-size:20px } .kpi .big { font-size:23px } }
@media (prefers-reduced-motion: reduce) { * { transition:none !important } }
</style>
</head>
<body>
<div class="top">
  <span class="brand">Answer<em>.</em> with its method</span>
  <span class="datachip" id="dates"></span>
  <span class="grow"></span>
  <span class="seg" role="group" aria-label="Who is using it"><button id="role-analyst" aria-pressed="true">Analyst</button><button id="role-sarah" aria-pressed="false">Reviewer</button></span>
</div>
<div class="page">
  <div class="stepper" id="stepper"></div>
  <div id="note"></div>
  <main id="view"></main>
</div>
<div class="actions"><div class="in" id="actions"></div></div>
<script>
let META = null, role = 'analyst';
const freshAsk = () => ({question:'', asker:'', audience:'committee', audienceOther:''});
let S = {ask:freshAsk(), interp:null, interpKey:'', choices:null, sources:null, reasons:{}, parent:null, flags:[], rec:null};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const SCEN = {central:'Central', severe:'Severe', low:'Low emissions'};
const AUD = {committee:['Committee', 'Central at 2050'], pra:['PRA / stress', 'Central and severe, 2030 and 2050'], other:['Other', 'Committee defaults apply']};
const SRC = {question:'From the question', default:'Default', analyst:'Changed by analyst', added:'Added by analyst'};
const DIMLABEL = {region:'Region', property_type:'Property type'};
const DEFAULTED = ['scenarios','years','exclusions','unit','origination_source'];
const RATE = ['A','B','C','D','E','F','G'];
const EXAMPLES = [['How many CRE loans have a flood rating of E or worse by 2050?','Credit committee'], ["What's our total expected climate loss by 2050?",'CRO'],
  ['How much of our 2024 and 2025 lending went into high subsidence areas?','Mortgage pricing'], ['How much do expected losses rise from 2030 to 2050 under the severe scenario?','Treasury']];

async function api(path, body) {
  if (window.mockApi) return window.mockApi(path, body);
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {});
  const j = await r.json(); if (!r.ok) throw new Error(j.detail || r.statusText); return j;
}
function fmt(v) {
  if (Array.isArray(v)) return v.map(x => SCEN[x] || x).join(', ') || 'none';
  if (v && typeof v === 'object') return Object.entries(v).filter(([,x]) => x && (!Array.isArray(x) || x.length)).map(([k,x]) => k.replace(/_/g,' ') + (x === true ? '' : ' ' + (Array.isArray(x) ? x.join(', ') : x))).join(', ') || 'none';
  return SCEN[v] || String(v ?? 'none');
}
function stepper(cur) {
  const steps = role === 'sarah' ? [['review','Review']] : [['ask','Ask'],['confirm','Confirm'],['answer','Answer'],['review','Review']];
  const i = steps.findIndex(s => s[0] === cur);
  $('#stepper').innerHTML = steps.map(([k,l], j) => `${j ? '<span class="bar"></span>' : ''}<span class="s ${j === i ? 'on' : j < i ? 'done' : ''}"><span class="n">${j < i ? '✓' : j + 1}</span>${l}</span>`).join('');
}
function actions(left, right) { $('#actions').innerHTML = `${left || ''}<span class="err" id="err" role="alert"></span>${right || ''}`; }
function showErr(e) { $('#err').textContent = e.message || e; }
function setRole(r) { role = r; $('#role-analyst').setAttribute('aria-pressed', r === 'analyst'); $('#role-sarah').setAttribute('aria-pressed', r === 'sarah'); r === 'sarah' ? renderQueue() : renderAsk(); }
$('#role-analyst').onclick = () => setRole('analyst'); $('#role-sarah').onclick = () => setRole('sarah');

async function init() {
  META = await api('/api/meta');
  $('#dates').textContent = `Spectra export ${META.export_as_at} · Loan book ${META.book_as_at}`;
  if (window.demoNote) $('#note').innerHTML = `<div class="note-demo">${window.demoNote}</div>`;
  renderAsk();
}

// ---------- 1 Ask ----------
async function renderAsk() {
  stepper('ask'); const a = S.ask; const mine = (await api('/api/answers')).slice().reverse();
  $('#view').innerHTML = `<h1>What was asked?</h1><p class="sub">Paste the question exactly as it came in. The audience sets Sarah's default scenario and years.</p>
    <div class="card"><div class="bd">
      <div class="field"><label class="lbl" for="q">Question</label><textarea id="q" placeholder="e.g. How many CRE loans have a flood rating of E or worse by 2050?">${esc(a.question)}</textarea>
        <div class="examples"><span>Try an example:</span>${EXAMPLES.map((e, i) => `<button class="pill" data-ex="${i}">${esc(e[1])}</button>`).join('')}</div></div>
      <div class="field"><label class="lbl" for="asker">Asked by</label><input type="text" id="asker" list="askers" value="${esc(a.asker)}" placeholder="e.g. Credit committee">
        <datalist id="askers">${['CRO','Risk committee','Credit committee','Mortgage pricing','Treasury','Investor relations','Sustainability reporting','PRA'].map(x => `<option value="${x}">`).join('')}</datalist></div>
      <div class="field"><span class="lbl">Audience</span><div class="choices">${Object.entries(AUD).map(([k,[l,h]]) => `<label class="opt"><input type="radio" name="aud" value="${k}" ${a.audience === k ? 'checked' : ''}><b>${l}</b><small>${h}</small></label>`).join('')}</div>
        <input type="text" id="audOther" placeholder="Who is it for? e.g. Board ESG committee" value="${esc(a.audienceOther)}" style="margin-top:10px" ${a.audience === 'other' ? '' : 'hidden'}></div>
    </div></div>
    <div class="card"><p class="sec">My answers</p><div class="list">${mine.length ? mine.map(x => `<button class="li" data-open="${x.id}"><span><span class="tag ${x.status === 'approved' ? 'pass' : x.status === 'sent_back' ? 'fail' : ''}">${esc(x.status.replace('_',' '))}</span> ${x.fast_track ? '<span class="tag brand">Fast-track</span>' : ''}</span><span>${esc(x.question)}</span><span class="meta">${esc(x.result.headline)}</span></button>`).join('') : '<div class="empty">No answers yet.</div>'}</div></div>`;
  const save = () => { a.question = $('#q').value; a.asker = $('#asker').value; a.audienceOther = $('#audOther').value; };
  ['#q','#asker','#audOther'].forEach(s => $(s).oninput = save);
  document.querySelectorAll('input[name=aud]').forEach(r => r.onchange = () => { a.audience = r.value; $('#audOther').hidden = r.value !== 'other'; });
  document.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => { const [q, w] = EXAMPLES[b.dataset.ex]; $('#q').value = q; $('#asker').value = w; save(); });
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openMine(b.dataset.open));
  actions('', `<button class="btn primary" id="next">Continue →</button>`);
  $('#next').onclick = toConfirm;
}
async function toConfirm() {
  const a = S.ask;
  if (a.audience === 'other' && !a.audienceOther.trim()) return showErr('Say who the answer is for.');
  const aud = a.audience === 'other' ? a.audienceOther.trim() : a.audience;
  const k = JSON.stringify([a.question.trim(), aud]);
  if (S.interp && S.interpKey === k && !S.parent) return renderConfirm();     // back, then forward again: keep every edit
  try {
    const r = await api('/api/interpret', {question:a.question, audience:aud, asker:a.asker});
    S = {...S, interp:r, interpKey:k, choices:clone(r.choices), sources:clone(r.sources), flags:r.flags, defaults:r.defaults, reasons:{}, parent:null, sentBack:null, audienceSent:aud};
    renderConfirm();
  } catch (e) { showErr(e); }
}
async function openMine(id) {
  const x = await api('/api/answers/' + id); S.rec = x;
  if (x.status === 'approved') return renderApproved(x);
  if (x.status === 'sent_back') { S = {...S, choices:clone(x.choices), sources:clone(x.sources), reasons:clone(x.reasons || {}), flags:[], parent:x.parent_id, sentBack:x.comments.at(-1)?.text, audienceSent:x.audience,
    ask:{...S.ask, question:x.question, asker:x.asker}, interp:{question_years:x.question_years}, interpKey:'', defaults:x.defaults || S.defaults}; return renderConfirm(); }
  renderAnswer(x);
}

// ---------- 2 Confirm ----------
function isDeparture(f) { return DEFAULTED.includes(f) && S.sources[f] === 'analyst' && S.defaults && JSON.stringify(S.choices[f]) !== JSON.stringify(S.defaults[f]); }
function setC(f, v) { S.choices[f] = v; S.sources[f] = 'analyst'; renderConfirm(); }
function tag(f) { const s = S.sources[f] || 'default'; return `<span class="tag ${s === 'added' ? 'analyst' : s}">${SRC[s]}</span>`; }
function chk(group, val, on, label) { return `<label class="chk"><input type="checkbox" data-g="${group}" value="${esc(val)}" ${on ? 'checked' : ''}>${esc(label ?? val)}</label>`; }
function rateChips(c) {
  const lo = c.rating_min ? RATE.indexOf(c.rating_min) : -1, hi = c.rating_max ? RATE.indexOf(c.rating_max) : 6;
  return `<div class="chips">${RATE.map((r, i) => `<label class="chk rate" style="background:var(--r-${r.toLowerCase()})" title="Rating ${r}"><input type="checkbox" data-rate="${r}" ${lo >= 0 && i >= lo && i <= hi ? 'checked' : ''}>${r}</label>`).join('')}</div>
    <div class="hint">${lo >= 0 ? `Rated ${c.rating_min}${c.rating_max && c.rating_max !== 'G' ? ' to ' + c.rating_max : ' or worse'}. Click a letter to set where the band starts.` : 'Click a letter to set where the band starts.'}</div>`;
}
function row(name, f, control, opts = {}) {
  const flags = (S.flags || []).filter(x => x.field === f);
  const dep = isDeparture(f) ? `<div class="dep"><span>Changes Sarah's default, so it <b>needs her approval</b>.</span><input type="text" data-reason="${f}" placeholder="Why the change?" value="${esc(S.reasons[f] || '')}"></div>` : '';
  return `<div class="row"><div class="k">${name}</div><div class="v">${control}${flags.map(x => `<div class="flag ${x.kind}">${esc(x.text)}</div>`).join('')}${dep}</div><div>${tag(opts.tagKey || f)}${opts.remove ? ` <button class="x" title="Remove ${esc(name)}" data-rm="${opts.remove}">×</button>` : ''}</div></div>`;
}
function renderConfirm() {
  stepper('confirm'); const c = S.choices, ex = c.exclusions || {};
  const general = (S.flags || []).filter(x => !x.field);
  const dims = Object.keys(META.dims).filter(d => !(c.filters || {})[d]);
  $('#view').innerHTML = `<h1>Confirm how to answer it</h1><p class="sub">“${esc(S.ask.question)}”${S.ask.asker ? ' · ' + esc(S.ask.asker) : ''}</p>
    ${S.sentBack ? `<div class="callout"><h2>Sent back by Sarah</h2><span>${esc(S.sentBack)}</span></div>` : ''}
    ${general.map(x => `<div class="flag ${x.kind}" style="margin:0 0 12px">${esc(x.text)}</div>`).join('')}
    <div class="card"><p class="sec">What and who</p><div class="rows">
      ${row('Measure', 'measure', `<select data-f="measure">${[['count','Count of loans, with their balance'],['loss','£ expected damage to properties'],['rise','Rise between two years'],['share','Share of lending']].map(([k,v]) => `<option value="${k}" ${c.measure === k ? 'selected' : ''}>${v}</option>`).join('')}</select>`)}
      ${row('Loans', 'loan_type', `<select data-f="loan_type"><option value="">All loans</option>${META.loan_types.map(t => `<option ${c.loan_type === t ? 'selected' : ''}>${t}</option>`).join('')}</select>`)}
      ${c.measure === 'share' ? row('Originated in', 'originated', `<input type="text" data-f="originated" value="${esc((c.originated || []).join(', '))}" placeholder="e.g. 2024, 2025">`) : ''}
      ${Object.entries(c.filters || {}).map(([d, vals]) => row(DIMLABEL[d] || d, 'filter:' + d, `<div class="chips">${META.dims[d].map(v => chk('filter:' + d, v, vals.includes(v))).join('')}</div>`, {tagKey:'filter:' + d, remove:d})).join('')}
      ${row('Hazards', 'hazards', `<div class="chips">${META.hazards.map(h => chk('hazards', h, c.hazards.includes(h), h[0].toUpperCase() + h.slice(1))).join('')}</div><div class="hint">None selected means all four hazards.</div>`)}
      ${c.measure === 'count' || c.measure === 'share' ? row('Rating', 'rating', rateChips(c)) : ''}
    </div>${dims.length ? `<div class="add"><span class="lbl" style="margin:0">+ Add a choice</span><select id="adddim"><option value="">Choose…</option>${dims.map(d => `<option value="${d}">${DIMLABEL[d] || d}</option>`).join('')}</select></div>` : ''}</div>
    <div class="card"><p class="sec">Settings</p><div class="rows">
      ${row('Scenario', 'scenarios', `<div class="chips">${Object.keys(META.scenarios).map(s => chk('scenarios', s, c.scenarios.includes(s), SCEN[s] + ' · ' + META.scenarios[s].toUpperCase())).join('')}</div>`)}
      ${row('Years', 'years', `<div class="chips">${META.years.map(y => chk('years', y, c.years.includes(y))).join('')}</div>`)}
      ${c.measure === 'count' ? row('Count per', 'unit', `<div class="chips">${chk('unit', 'loans', c.unit === 'loans', 'Loan')}${chk('unit', 'properties', c.unit === 'properties', 'Property')}</div>`) : ''}
      ${row('Exclusions', 'exclusions', `<div class="chips">${chk('ex', 'in_default', ex.in_default, 'In default')}${chk('ex', 'redeemed', ex.redeemed, 'Redeemed since the export')}${chk('ex', 'maturing_before', ex.maturing_before, 'Maturing before 2030')}</div>`)}
      ${c.originated ? row('Origination date', 'origination_source', `<div class="chips">${chk('osrc', 'loan_book', c.origination_source === 'loan_book', 'Loan system')}${chk('osrc', 'spectra', c.origination_source === 'spectra', 'Spectra export')}</div>`) : ''}
    </div></div>`;
  document.querySelectorAll('[data-f]').forEach(el => el.onchange = () => { const f = el.dataset.f;
    const v = f === 'originated' ? el.value.split(',').map(x => parseInt(x)).filter(Boolean) : f === 'loan_type' ? (el.value || null) : el.value; setC(f, v); });
  document.querySelectorAll('[data-rate]').forEach(el => el.onchange = () => { const r = el.dataset.rate;
    if (c.rating_min === r && !el.checked) { c.rating_min = null; c.rating_max = null; } else { c.rating_min = r; c.rating_max = c.rating_max && RATE.indexOf(c.rating_max) >= RATE.indexOf(r) ? c.rating_max : null; }
    S.sources.rating = 'analyst'; renderConfirm(); });
  document.querySelectorAll('input[data-g]').forEach(el => el.onchange = () => {
    const g = el.dataset.g;
    if (g === 'ex') return setC('exclusions', {...c.exclusions, [el.value]: el.value === 'maturing_before' ? (el.checked ? 2030 : null) : el.checked});
    if (g === 'unit') return setC('unit', el.value);
    if (g === 'osrc') return setC('origination_source', el.value);
    if (g.startsWith('filter:')) { const d = g.slice(7); let cur = c.filters[d] || []; cur = el.checked ? [...cur, el.value] : cur.filter(x => x !== el.value);
      c.filters[d] = cur; S.sources[g] = S.sources[g] === 'question' ? 'analyst' : (S.sources[g] || 'added'); return renderConfirm(); }
    let cur = [...(c[g] || [])]; cur = el.checked ? [...new Set([...cur, el.value])] : cur.filter(x => x !== el.value); cur.sort(); setC(g, cur);
  });
  document.querySelectorAll('[data-reason]').forEach(el => el.oninput = () => S.reasons[el.dataset.reason] = el.value);
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { delete c.filters[b.dataset.rm]; delete S.sources['filter:' + b.dataset.rm]; renderConfirm(); });
  if ($('#adddim')) $('#adddim').onchange = e => { if (!e.target.value) return; c.filters = {...(c.filters || {}), [e.target.value]: []}; S.sources['filter:' + e.target.value] = 'added'; renderConfirm(); };
  actions(`<button class="btn secondary" id="back">← Back</button>`, `<button class="btn primary" id="next">Confirm and calculate →</button>`);
  $('#back').onclick = () => S.parent ? renderApproved(S.rec) : renderAsk();
  $('#next').onclick = calculate;
}
async function calculate() {
  const c = S.choices;
  if (!c.scenarios.length) return showErr('Pick at least one scenario.');
  if (!c.years.length) return showErr('Pick at least one year.');
  const empty = Object.entries(c.filters || {}).filter(([,v]) => !v.length).map(([d]) => DIMLABEL[d] || d);
  if (empty.length) return showErr(`Pick at least one value for ${empty.join(', ')}, or remove it.`);
  try {
    const rec = await api('/api/compute', {question:S.ask.question, audience:S.audienceSent || S.ask.audience, asker:S.ask.asker, choices:c, sources:S.sources,
      question_years:S.interp?.question_years || [], reasons:S.reasons, parent_id:S.parent});
    S.rec = rec; renderAnswer(rec);
  } catch (e) { showErr(e); }
}

// ---------- 3 Answer ----------
function sidePanel(a) {
  const c = a.choices; const f = Object.entries(c.filters || {}).filter(([,v]) => v.length);
  return `<aside class="side"><div class="card"><p class="sec">Settings used</p><div class="bd"><dl class="kv">
    <dt>Scenario</dt><dd>${esc(fmt(c.scenarios))}</dd><dt>Years</dt><dd>${esc(c.years.join(', '))}</dd>
    <dt>Loans</dt><dd>${esc(c.loan_type || 'All')}</dd>${f.map(([d,v]) => `<dt>${DIMLABEL[d] || d}</dt><dd>${esc(v.join(', '))}</dd>`).join('')}
    <dt>Hazards</dt><dd>${esc(c.hazards.length ? c.hazards.join(', ') : 'All')}</dd>${c.rating_min ? `<dt>Rating</dt><dd>${c.rating_min}${c.rating_max ? '–' + c.rating_max : '+'}</dd>` : ''}
    <dt>Exclusions</dt><dd>${esc(fmt(c.exclusions))}</dd></dl></div></div>
    <div class="card"><p class="sec">Data</p><div class="bd foot">${a.result.counts.included} included · ${a.result.counts.excluded} excluded<br>${a.result.counts.unmatched} unmatched · ${a.result.counts.unscored} unscored<br>Calculated by code from the loaded files</div></div>
    ${window.mockApi ? '' : `<a class="btn secondary" style="width:100%;justify-content:center" href="/api/answers/${a.id}/export.xlsx">Download source rows (Excel)</a>`}</aside>`;
}
function resultMain(a) {
  const r = a.result, v = Object.entries(r.verdicts || {}).filter(([,t]) => t); if (r.versions_verdict) v.push(['scenario', r.versions_verdict]);
  const failed = r.checks.filter(c => !c.ok).length;
  const drivers = Object.entries(r.drivers || {}).map(([k,d]) => { const t = Object.values(d).reduce((x,y) => x + y, 0);
    return `<div class="vr"><b>${k === 'by_hazard' ? 'By hazard' : 'By ' + k.slice(3).replace('_',' ')}</b><span>${Object.entries(d).slice(0,3).map(([n,x]) => `${esc(n)} ${(100*x/t).toFixed(1)}%`).join(' · ')}</span></div>`; }).join('');
  return `<div class="card kpi"><p class="sec">Answer</p><div class="bd">${failed ? `<span class="tag fail">✕ ${failed} failed check${failed > 1 ? 's' : ''}</span>` : '<span class="tag pass">✓ All checks pass</span>'}
      <div class="big">${esc(r.headline)}</div>${r.grid.length > 1 ? r.grid.slice(1).map(g => `<div class="alt">${esc(g.text)}</div>`).join('') : ''}</div></div>
    <div class="card"><p class="sec">If one choice changed</p><div class="bd vers">${r.versions.map(x => `<div class="vr"><b>${esc(x.change)}</b><span>${esc(x.text)}</span></div>`).join('')}${drivers}
      ${v.map(([k,t]) => `<div class="verdict"><span class="tag">${esc(k)}</span><span>${esc(t)}</span></div>`).join('')}</div></div>
    <div class="card"><p class="sec">Checks</p><div class="bd checks">${r.checks.map(c => `<div class="c"><span class="tag ${c.ok ? 'pass' : 'fail'}">${c.ok ? '✓ Pass' : '✕ Fail'}</span><span><b>${esc(c.name)}.</b> ${esc(c.detail)}</span></div>`).join('')}</div></div>
    <div class="card"><p class="sec" style="display:flex;justify-content:space-between;align-items:center">Method note <button class="btn secondary small" id="copy">Copy</button></p><div class="bd"><ol class="note" id="notelist">${r.method_note.map(l => `<li>${esc(l)}</li>`).join('')}</ol></div></div>`;
}
function wireCopy(a) { const b = $('#copy'); if (!b) return; b.onclick = async () => { try { await navigator.clipboard.writeText(a.result.method_note.join('\n')); b.textContent = 'Copied'; } catch { const r = document.createRange(); r.selectNodeContents($('#notelist')); getSelection().removeAllRanges(); getSelection().addRange(r); } }; }
function renderAnswer(a) {
  stepper('answer'); const failed = a.result.checks.filter(c => !c.ok);
  $('#view').innerHTML = `<h1>Answer</h1><p class="sub">“${esc(a.question)}” · <span class="tag">${esc(a.status.replace('_',' '))}</span></p>
    <div class="layout"><div>${resultMain(a)}
    ${a.status === 'draft' ? `<div class="card"><div class="bd"><label class="lbl" for="cm">Note for Sarah ${failed.length ? `<span class="tag fail">required: ${failed.length} failed</span>` : '<span class="hint">(optional)</span>'}</label><textarea id="cm">${esc(S.note || '')}</textarea></div></div>` : ''}
    </div>${sidePanel(a)}</div>`;
  wireCopy(a); if ($('#cm')) $('#cm').oninput = e => S.note = e.target.value;
  actions(`<button class="btn secondary" id="back">← Back to choices</button>`, a.status === 'draft' ? `<button class="btn primary" id="next">Submit to Sarah →</button>` : `<button class="btn secondary" id="home">Done</button>`);
  $('#back').onclick = () => { S.choices = clone(a.choices); S.sources = clone(a.sources); S.reasons = clone(a.reasons || {}); S.parent = a.parent_id; renderConfirm(); };
  if ($('#home')) $('#home').onclick = renderAsk;
  if ($('#next')) $('#next').onclick = async () => { try { await api(`/api/answers/${a.id}/submit`, {comment:$('#cm').value});
    S = {ask:freshAsk(), interp:null, interpKey:'', choices:null, sources:null, reasons:{}, parent:null, flags:[], rec:null, note:''}; renderAsk(); } catch (e) { showErr(e); } };
}
function renderApproved(a) {
  stepper('answer');
  $('#view').innerHTML = `<h1>Approved, ready to send</h1><p class="sub">“${esc(a.question)}”</p>
    <div class="layout"><div><div class="card kpi"><p class="sec">Answer</p><div class="bd"><span class="tag pass">✓ Approved by Sarah</span><div class="big">${esc(a.result.headline)}</div></div></div>
    <div class="card"><div class="bd"><label class="lbl" for="fu">Follow-up from the asker</label><input type="text" id="fu" value="${esc(S.followText || '')}" placeholder="e.g. What about the severe scenario?">
      <div class="examples"><span>Try:</span><button class="pill" data-fu="What about the severe scenario?">Severe scenario</button><button class="pill" data-fu="And by 2030?">2030</button><button class="pill" data-fu="Just the South East?">South East only</button></div></div></div></div>
    ${sidePanel(a)}</div>`;
  $('#fu').oninput = e => S.followText = e.target.value;
  document.querySelectorAll('[data-fu]').forEach(b => b.onclick = () => { $('#fu').value = S.followText = b.dataset.fu; });
  actions(`<button class="btn secondary" id="back">← Back</button>`, `<button class="btn primary" id="next">Answer the follow-up →</button>`);
  $('#back').onclick = renderAsk;
  $('#next').onclick = async () => { try { const r = await api(`/api/answers/${a.id}/followup`, {question:$('#fu').value});
    S = {...S, choices:r.choices, sources:r.sources, flags:r.flags, parent:a.id, reasons:clone(a.reasons || {}), sentBack:null, ask:{...S.ask, question:r.question, asker:a.asker}, interp:{question_years:r.question_years}, interpKey:'', audienceSent:a.audience, rec:a};
    renderConfirm(); } catch (e) { showErr(e); } };
}

// ---------- 4 Review ----------
async function renderQueue() {
  stepper('review'); const all = await api('/api/answers'); const q = all.filter(a => a.status === 'submitted');
  $('#view').innerHTML = `<h1>Waiting for your review</h1><p class="sub">${q.length} answer${q.length === 1 ? '' : 's'} to check before they go out.</p>
    <div class="card"><div class="list">${q.map(a => { const f = a.result.checks.filter(c => !c.ok).length;
      return `<button class="li" data-r="${a.id}"><span>${a.fast_track ? '<span class="tag brand">Fast-track</span> ' : ''}${f ? `<span class="tag fail">✕ ${f} failed</span> ` : '<span class="tag pass">✓ Checks pass</span> '}${a.departures.length ? '<span class="tag analyst">Changes your defaults</span>' : ''}</span><span><b>${esc(a.question)}</b></span><span class="meta">${esc(a.asker)} · ${esc(a.result.headline)}</span></button>`; }).join('') || '<div class="empty">Nothing waiting. Switch to Analyst and submit an answer.</div>'}</div></div>`;
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = async () => renderReview(await api('/api/answers/' + b.dataset.r)));
  actions('', '');
}
function diffText(d) { if (d.field === 'filters') { const k = Object.keys({...(d.from || {}), ...(d.to || {})}).find(k => JSON.stringify((d.from || {})[k]) !== JSON.stringify((d.to || {})[k]));
  return `<b>${esc(DIMLABEL[k] || k)}</b> ${esc(((d.from || {})[k] || []).join(', ') || 'all')} → ${esc(((d.to || {})[k] || []).join(', ') || 'all')}`; }
  return `<b>${esc({scenarios:'Scenario', years:'Years', exclusions:'Exclusions', unit:'Counting'}[d.field] || d.field)}</b> ${esc(fmt(d.from))} → ${esc(fmt(d.to))}`; }
function renderReview(a) {
  const failed = a.result.checks.filter(c => !c.ok);
  const fast = a.fast_track ? `<div class="callout fast"><h2>Fast-track follow-up</h2><span>Only one thing changed from the answer you approved: ${diffText(a.diff[0])}.</span>
      <span class="hint">Before: ${esc(a.parent_headline)}</span><span>Now: <b>${esc(a.result.headline)}</b></span><span class="hint">All checks pass and nothing departs from your defaults.</span></div>` : '';
  const top = failed.length || a.departures.length ? `<div class="callout"><h2>Look at these first</h2><div class="checks">
      ${failed.map(c => `<div class="c"><span class="tag fail">✕ Fail</span><span><b>${esc(c.name)}.</b> ${esc(c.detail)}</span></div>`).join('')}</div>
      ${a.departures.map(d => `<div class="dep">Changed your default <b>${esc(d.field)}</b> from ${esc(fmt(d.default))} to ${esc(fmt(d.chosen))}. Reason: ${esc(a.reasons[d.field])}</div>`).join('')}
      ${a.comments.filter(x => x.by === 'analyst' && x.text).map(x => `<span><b>Analyst:</b> ${esc(x.text)}</span>`).join('')}</div>` : '';
  $('#view').innerHTML = `<h1>${a.fast_track ? 'Review the follow-up' : 'Review the answer'}</h1><p class="sub">“${esc(a.question)}” · asked by ${esc(a.asker)}</p>${fast}${top}
    <div class="layout"><div>${resultMain(a)}<div class="card"><div class="bd"><label class="lbl" for="rc">Comment <span class="hint">(required to send back)</span></label><textarea id="rc"></textarea></div></div></div>${sidePanel(a)}</div>`;
  wireCopy(a);
  actions(`<button class="btn secondary" id="back">← Back to queue</button>`, `<button class="btn danger" id="no">Send back</button><button class="btn primary" id="ok">Approve</button>`);
  $('#back').onclick = renderQueue;
  $('#ok').onclick = async () => { try { await api(`/api/answers/${a.id}/review`, {decision:'approve', comment:$('#rc').value}); renderQueue(); } catch (e) { showErr(e); } };
  $('#no').onclick = async () => { try { await api(`/api/answers/${a.id}/review`, {decision:'send_back', comment:$('#rc').value}); renderQueue(); } catch (e) { showErr(e); } };
}
init();
</script>
</body>
</html>
